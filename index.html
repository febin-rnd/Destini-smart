<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Travel Suggestor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Travel Suggestor</h1>
        <p>Enter your details to find a destination:</p>
        
        <div class="input-group">
            <label>Total Budget ($)</label>
            <input type="number" id="totalBudget" placeholder="e.g. 1000">
        </div>

        <div class="input-group">
            <label>Number of Days</label>
            <input type="number" id="totalDays" placeholder="e.g. 7">
        </div>

        <button onclick="suggestTrip()">Find My Trip</button>

        <div id="result-container" class="hidden">
            <h3>We Recommend:</h3>
            <div id="result-card">
                <h2 id="destination-name"></h2>
                <p id="destination-info"></p>
                <p><strong>Estimated Daily Cost:</strong> $<span id="daily-cost"></span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
