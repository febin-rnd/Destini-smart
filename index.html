<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Destini</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    padding:30px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:14px;
    max-width:800px;
    margin:auto;
}

input,button{
    padding:12px;
    border-radius:8px;
    border:none;
    margin:6px;
}

button{
    background:#f97316;
    color:white;
    cursor:pointer;
}

.resultCard{
    background:#334155;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

img{
    width:100%;
    border-radius:12px;
}

#map{
    height:400px;
    margin-top:20px;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="card">

<h2>🌍 Smart Destini</h2>

<input id="budget" type="number" placeholder="Total Budget">
<input id="days" type="number" placeholder="Days">

<button onclick="suggest()">Generate My Escape</button>

<div id="suggestion"></div>

<hr>

<h3>Route Planner</h3>

<input id="start" placeholder="Start City">
<input id="end" placeholder="Destination">

<button onclick="showRoute()">Show Route</button>

<div id="km"></div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<script src="script.js"></script>

</body>
</html>
